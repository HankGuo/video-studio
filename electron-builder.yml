# TokenDance 视频接入助手 —— Electron 桌面壳打包配置
# 用法：npm install && npm run pack:mac|pack:win|pack:linux（一台机器可交叉打出三平台）
appId: space.tokendance.videostudio
productName: TokenDance 视频接入助手
copyright: MIT

# 仅打包时覆盖入口为 Electron 壳，仓库 package.json 的 main 保持 server.js 不变
extraMetadata:
  main: desktop/main.js

directories:
  buildResources: assets   # assets/icon.png（2048×2048）自动生成 icns/ico
  output: dist

# 运行时零依赖：打包内容里没有 node_modules，就是这几百行源码
files:
  - server.js
  - main/**
  - renderer/**
  - desktop/**
  - assets/icon.png
  - package.json

mac:
  category: public.app-category.productivity
  identity: null            # 无 Apple 开发者证书：ad-hoc 签名，用户首次右键→打开即可
  darkModeSupport: true
  target:
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false           # 安装向导版（可选安装目录），比一键安装更适合小白
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: TokenDance 视频接入助手

linux:
  category: AudioVideo
  target:
    - target: AppImage
      arch: [x64, arm64]
