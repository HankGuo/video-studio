# TokenDance 视频接入助手 —— Electron 桌面壳打包配置
# 用法：npm install && npm run pack:mac|pack:win|pack:linux（一台机器可交叉打出三平台）
appId: space.tokendance.videostudio
productName: TokenDance 视频接入助手
copyright: MIT

# 产物文件名固定为 ASCII。productName 是中文，默认产物名会带中文和空格，
# 在 Release 下载 URL 里会被百分号编码成一长串，易碎且无法肉眼辨认，故此处显式覆盖。
artifactName: "VideoStudio-${version}-${os}-${arch}.${ext}"

# 仅打包时覆盖入口为 Electron 壳，仓库 package.json 的 main 保持 server.js 不变
extraMetadata:
  main: desktop/main.js

directories:
  buildResources: assets   # assets/icon.png（2048×2048）自动生成 icns/ico
  output: dist

# 运行时零依赖：打包内容里没有 node_modules，就是这几百行源码
files:
  - server.js
  - main/**
  - renderer/**
  - desktop/**
  - assets/icon.png
  - package.json

mac:
  category: public.app-category.productivity
  # 必须是 "-"（ad-hoc 签名），不是 null。null 的语义是「完全跳过签名」，
  # 会让包内留着 Electron 官方的 linker-signed 签名——它描述的是改包名/Info.plist
  # 之前的旧内容，装完必然验签失败，下载后 macOS 报「文件已损坏」且右键→打开无法绕过。
  identity: "-"
  # hardened runtime 在非 MAS 构建下默认 true，与 ad-hoc 签名冲突（library validation
  # 会拦住未用同一证书签名的库），必须关掉，否则包能验签却起不来。
  hardenedRuntime: false
  darkModeSupport: true
  target:
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  artifactName: "VideoStudio-${version}-win-setup.${ext}"   # 区分安装向导版与绿色 zip
  oneClick: false           # 安装向导版（可选安装目录），比一键安装更适合小白
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: TokenDance 视频接入助手

linux:
  category: AudioVideo
  target:
    - target: AppImage
      arch: [x64, arm64]
